name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  run-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
          
      - name: Run Tests
        run: |
          dotnet test MathParserNet\MathParserNetTest\MathParserNetTest.csproj